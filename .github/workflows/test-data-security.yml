name: Test data security validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-data-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject sensitive test data
        run: python3 scripts/validate_test_data.py --root . --output .qa-artifacts/security-findings.json
      - name: Upload security findings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: security-findings-${{ github.run_id }}
          path: .qa-artifacts/security-findings.json
          if-no-files-found: ignore
