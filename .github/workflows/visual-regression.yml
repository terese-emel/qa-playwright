name: Visual Regression

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    # Skip entirely when DEMO_BASE_URL is not configured — baselines require a
    # real target. Set the repo variable and commit baselines first.
    if: vars.DEMO_BASE_URL != ''
    # Run inside the official Playwright image so font rendering is identical
    # to the baselines committed in visual-baselines/.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run visual regression tests
        run: npx playwright test tests/visual-regression.spec.ts
        env:
          RUN_VISUAL_REGRESSION: "true"
          DEMO_BASE_URL: ${{ vars.DEMO_BASE_URL }}

      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-${{ github.run_id }}
          path: .qa-artifacts/
          retention-days: 7
