name: Playwright UI
run-name: QA ${{ inputs.orchestration_id }} - ${{ github.workflow }}
on:
  workflow_dispatch:
    inputs:
      orchestration_id:
        description: Correlation ID from central orchestrator
        required: false
        type: string
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.9.0"
      - name: Start the local demo application
        run: bash scripts/start-demo-app.sh
      - name: Install project dependencies
        run: npm ci --no-audit --no-fund
      - name: Check linting
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Execute Playwright UI
        env:
          RUN_LIVE_DEMO: "true"
          DEMO_BASE_URL: http://127.0.0.1:3000
          DEMO_USER: ${{ vars.DEMO_USER }}
          DEMO_PASSWORD: ${{ vars.DEMO_PASSWORD }}
        run: npm run test:playwright
      - name: Upload logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-playwright-${{ github.run_id }}
          path: |
            .qa-artifacts/
            reports/
            ${{ runner.temp }}/sample-app-web.log
          if-no-files-found: warn
