name: Requirement Coverage Check
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check requirement traceability
        run: python3 scripts/check_test_coverage.py --manifest coverage/manifest.json --output coverage/report.json
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: requirement-coverage-report
          path: coverage/report.json
          if-no-files-found: ignore
